<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ACCESS DENIED</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #F9F8F4;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .card {
      background-color: #ffffff;
      border: 4px solid #002855;
      box-shadow: 8px 8px 0px 0px #002855;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      max-width: 600px;
      width: 90%;
    }
    h1 {
      color: #002855;
      font-size: 3.5rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 16px;
      line-height: 1.1;
    }
    p {
      color: #002855;
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 32px;
    }
    button {
      background-color: #FFD166;
      border: 4px solid #002855;
      box-shadow: 4px 4px 0px 0px #002855;
      border-radius: 8px;
      padding: 16px 32px;
      font-size: 1.2rem;
      font-weight: 800;
      color: #002855;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px 0px #002855;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ACCESS DENIED</h1>
    <p>Operator is currently Locked-In. Return to your mission.</p>
    <button id="close-btn">Close Tab</button>
  </div>
  <script src="block.js"></script>
</body>
</html>
