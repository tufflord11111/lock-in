[package]
name = "app"
version = "1.2.10"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
sysinfo = "0.30"
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", optional = true }
# Lockdown: find and close browser windows. Store autostart adds
# Windows.ApplicationModel.StartupTask (needs package identity) through the feature.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }
windows-future = { version = "0.2", optional = true }

# NSIS (GitHub releases) is the default build. The Microsoft Store (MSIX) build
# is `--no-default-features --features store`: the Store updates the app, and
# autostart goes through the package's StartupTask instead of the Run key.
[features]
default = ["updater", "autostart"]
updater = ["dep:tauri-plugin-updater"]
autostart = ["dep:tauri-plugin-autostart"]
store = ["windows/ApplicationModel", "dep:windows-future"]


